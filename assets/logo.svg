<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Gulheefalhu View</title>
<desc id="desc">Gold tandoor flame, palm and island wave emblem on deep maroon</desc>
<defs>
  <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffb128"/>
    <stop offset="1" stop-color="#d76418"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f2cf84"/>
    <stop offset="1" stop-color="#c79335"/>
  </linearGradient>
</defs>
<circle cx="64" cy="64" r="62" fill="#2a0d10"/>
<circle cx="64" cy="64" r="58.5" fill="none" stroke="url(#gold)" stroke-width="2.5"/>

<!-- tandoor -->
<path d="M24 78c1-14 6-25 12-31 6-5 25-5 31 0 6 6 11 17 12 31Z" fill="#5b1a18" stroke="url(#gold)" stroke-width="2.6"/>
<ellipse cx="51.5" cy="47" rx="16.5" ry="5.5" fill="#1a090b" stroke="#f1ca82" stroke-width="2.6"/>

<!-- flame -->
<path d="M53 44c-8-6-4-13 0-18 1 7 8 9 5 18 5-4 7-10 5-16 8 7 9 17 3 24-4 4-9 6-14 4-7-3-9-8-7-13 1-4 4-7 7-10-1 5 0 8 1 11Z" fill="url(#flame)"/>
<path d="M54 50c-4-4-1-9 2-13 0 4 4 6 3 11 3-2 4-5 4-8 4 4 4 9 1 13-2 2-5 3-7 2-3-1-4-3-3-5Z" fill="#ffd978"/>

<!-- palm / island -->
<path d="M86 72c2-12 3-20 3-29" fill="none" stroke="#e7bd65" stroke-width="2.8" stroke-linecap="round"/>
<path d="M89 43c-6-5-11-5-15-1 6 0 10 2 14 5M89 43c2-7 7-11 13-11-4 4-6 8-8 13M89 43c7-4 13-3 17 1-6 0-10 2-14 4M89 43c-2-6-5-9-10-11 2 5 5 9 8 13" fill="none" stroke="#e7bd65" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="105" cy="65" r="6.5" fill="#d8a94e"/>
<path d="M75 76c9-4 18-5 28-3 7 1 13 1 19 0" fill="none" stroke="#f1ca82" stroke-width="2.4" stroke-linecap="round"/>
<path d="M76 81c9-2 18-2 27 0 7 2 13 2 19 0" fill="none" stroke="#c79335" stroke-width="1.8" stroke-linecap="round"/>

<!-- base wave -->
<path d="M22 90c16-7 31-7 46 0 14 6 27 6 39-1" fill="none" stroke="#f1ca82" stroke-width="2.8" stroke-linecap="round"/>
</svg>