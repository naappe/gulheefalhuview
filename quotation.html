<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gulheefalhu View — Quotation</title><style>
:root{font-family:Arial,sans-serif;color:#152c42}*{box-sizing:border-box}body{margin:0;background:#f1f4f7}.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:14px;background:#fff;position:sticky;top:0;box-shadow:0 2px 10px #0001;z-index:2;align-items:center}button,select,input,textarea{font:inherit;padding:8px;border:1px solid #cbd3dc;border-radius:5px}button{background:#17324f;color:white;cursor:pointer}main{margin:20px auto;background:#fff;width:min(95%,1000px);padding:24px;box-shadow:0 5px 30px #0001}.head{background:#17324f;color:white;padding:20px;border-bottom:5px solid #c9a45b}.head h1{margin:0;font-size:24px}.head small{color:#e2e9ef}.meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}.meta label{display:block;margin:8px 0;font-size:12px}.meta input,.meta textarea{display:block;width:100%;margin-top:3px}.meta textarea{min-height:55px}table{width:100%;border-collapse:collapse}th{background:#17324f;color:white;text-align:left;font-size:12px}td,th{padding:8px;border:1px solid #dce1e6}td input{width:100%;min-width:0}.num{width:80px}.right{text-align:right}.total{margin:18px 0 0 auto;background:#17324f;color:#fff;padding:15px;width:fit-content;font-weight:bold}.footer{margin-top:25px;display:flex;justify-content:space-between;gap:20px}.footer textarea{width:100%;min-height:70px}.signature{min-width:170px;text-align:center;padding-top:50px;border-bottom:1px solid #333}.muted{color:#667085;font-size:12px}#add{margin-top:10px}@page{margin:10mm;size:A5 landscape}body[data-paper="A4"][data-orientation="portrait"]{--size:A4}body[data-paper="A5"][data-orientation="portrait"]{--size:A5} @media print{body{background:white} .toolbar,.no-print{display:none!important}main{margin:0;width:100%;padding:0;box-shadow:none}.head{-webkit-print-color-adjust:exact;print-color-adjust:exact}th,.total{-webkit-print-color-adjust:exact;print-color-adjust:exact}input,textarea{border:0;padding:0;resize:none;background:transparent}table{table-layout:fixed}thead{display:table-header-group}tr{break-inside:avoid} .footer{break-inside:avoid}body[data-paper="A4"][data-orientation="landscape"]{--page:A4 landscape}body[data-paper="A4"][data-orientation="portrait"]{--page:A4 portrait}body[data-paper="A5"][data-orientation="landscape"]{--page:A5 landscape}body[data-paper="A5"][data-orientation="portrait"]{--page:A5 portrait}} </style><style id="print-size">@page{size:A5 landscape;margin:10mm}</style></head><body data-paper="A5" data-orientation="landscape"><div class="toolbar"><strong>Gulheefalhu View</strong><label>Paper <select id="paper"><option>A5</option><option>A4</option></select></label><label>Layout <select id="orientation"><option value="landscape">Landscape</option><option value="portrait">Portrait</option></select></label><button onclick="addRow()">+ Item</button><button onclick="save()">Save draft</button><button onclick="window.print()">Print / Save PDF</button><span class="muted">Drafts saved on this device only</span></div><main><div class="head"><h1>GULHEEFALHU VIEW</h1><small>SP34722026 · V. Lovely House, Boakeyo Goalhi 00960, K. Villigili, Maldives</small><h2>QUOTATION</h2></div><div class="meta"><div><label>Customer / Company<input id="customer" placeholder="Customer name"></label><label>Project / Site<textarea id="project" placeholder="Project name and location"></textarea></label></div><div><label>Quotation No.<input id="number" value="QT-2026-0001"></label><label>Date<input id="date" type="date"></label><label>Valid until<input id="valid" type="date"></label></div></div><table><thead><tr><th>Description</th><th style="width:12%">Qty</th><th style="width:18%">Unit price (MVR)</th><th style="width:20%">Amount (MVR)</th><th class="no-print" style="width:45px"></th></tr></thead><tbody id="items"></tbody></table><button class="no-print" id="add" onclick="addRow()">+ Add item</button><div class="total">TOTAL MVR <span id="total">0.00</span></div><div class="footer"><div style="flex:1"><strong>Terms & Conditions</strong><textarea id="terms">GST not charged — supplier not GST registered. Scope and payment terms as agreed.</textarea></div><div><div class="signature"></div><small>Authorized signature</small></div></div></main><script>
const $=id=>document.getElementById(id);function addRow(d={}){const tr=document.createElement('tr');tr.innerHTML='<td><input class="desc" placeholder="Work or materials"></td><td><input class="qty" type="number" min="0" step="any" value="1"></td><td><input class="price" type="number" min="0" step=".01" value="0"></td><td class="right amount">0.00</td><td class="no-print"><button type="button" aria-label="Remove item">×</button></td>';tr.querySelector('.desc').value=d.desc||'';tr.querySelector('.qty').value=d.qty??1;tr.querySelector('.price').value=d.price??0;tr.querySelector('button').onclick=()=>{tr.remove();calc()};tr.querySelectorAll('input').forEach(i=>i.oninput=calc);$('items').append(tr);calc()}function calc(){let sum=0;document.querySelectorAll('#items tr').forEach(tr=>{const n=(+tr.querySelector('.qty').value||0)*(+tr.querySelector('.price').value||0);tr.querySelector('.amount').textContent=n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});sum+=n});$('total').textContent=sum.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function setPaper(){document.body.dataset.paper=$('paper').value;document.body.dataset.orientation=$('orientation').value;$('print-size').textContent='@page{size:'+$('paper').value+' '+$('orientation').value+';margin:10mm}';localStorage.setItem('gv-paper',JSON.stringify({paper:$('paper').value,orientation:$('orientation').value}))}$('paper').onchange=setPaper;$('orientation').onchange=setPaper;function save(){const data={paper:$('paper').value,orientation:$('orientation').value,fields:Object.fromEntries(['customer','project','number','date','valid','terms'].map(id=>[id,$(id).value])),items:[...document.querySelectorAll('#items tr')].map(tr=>({desc:tr.querySelector('.desc').value,qty:tr.querySelector('.qty').value,price:tr.querySelector('.price').value}))};localStorage.setItem('gv-quotation',JSON.stringify(data));alert('Draft saved on this device')}try{const d=JSON.parse(localStorage.getItem('gv-quotation')||'null');const p=JSON.parse(localStorage.getItem('gv-paper')||'null');$('paper').value=d?.paper||p?.paper||'A5';$('orientation').value=d?.orientation||p?.orientation||'landscape';setPaper();if(d){Object.entries(d.fields||{}).forEach(([k,v])=>{if($(k))$(k).value=v});(d.items||[]).forEach(addRow)}else{addRow();$('date').value=new Date().toISOString().slice(0,10)}}catch(e){addRow()}
</script></body></html>
