 oninput="update(\'project\',this.value)">'+esc(doc.project)+'</textarea></label><div class="fieldrow"><label class="field">Date<input type="date" value="'+esc(doc.date)+'" oninput="update(\'date\',this.value)"></label><label class="field">Valid until<input type="date" value="'+esc(doc.valid)+'" oninput="update(\'valid\',this.value)"></label></div><h2>Items</h2><div id="itemsEditor" class="items-edit"></div><button class="secondary" onclick="addItem()">+ Add item</button><label class="field" style="margin-top:15px">Terms<textarea oninput="update(\'terms\',this.value)">'+esc(doc.terms)+'</textarea></label>'+(doc.type==='invoice'?'<label class="field">Payment received (MVR)<input type="number" min="0" step=".01" value="'+(+doc.paid||0)+'" oninput="update(\'paid\',this.value)"></label>':'')+'<div class="fieldrow"><label class="field">Paper<select onchange="update(\'paper\',this.value)"><option '+(doc.paper==='A5'?'selected':'')+'>A5</option><option '+(doc.paper==='A4'?'selected':'')+'>A4</option></select></label><label class="field">Orientation<select onchange="update(\'orientation\',this.value)"><option value="landscape" '+(doc.orientation==='landscape'?'selected':'')+'>Landscape</option><option value="portrait" '+(doc.orientation==='portrait'?'selected':'')+'>Portrait</option></select></label></div><div class="actions"><button class="primary" onclick="saveDoc()">Save document</button><button class="secondary" onclick="printDoc()">Print / PDF</button><button class="secondary" onclick="go(\'documents\')">Back</button></div><p class="muted">Saved locally on this device. Cloud synchronization is not enabled.</p></div><div><p class="preview-caption muted">LIVE PRINT PREVIEW · '+doc.paper+' '+doc.orientation+'</p><div class="preview-wrap"><article id="paper" class="paper"></article></div></div></div>';renderItems();preview()}function changeType(type){if(doc.type===type)return;if(!confirm('Change document type and generate a new number?')){render();return}doc.type=type;doc. ting=doc.id;alert('Document saved on this device')}function printDoc(){window.print()}render();
