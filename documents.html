rif}.paper .doc-bottom{color:#7b8792;border-color:#dce2e8}.preview-wrap{background:#e8edf3}.paper.a5.landscape{min-height:148mm}.paper.a4.portrait{min-height:297mm}@media print{.paper{padding:0!important}}</style><style id="pageStyle">@page{size:A5 landscape;margin:8mm}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><strong>GULHEEFALHU VIEW</strong><small>Documents workspace</small></div><nav id="nav"></nav></aside><div class="main"><header class="top"><div><div class="eyebrow">GULHEEFALHU VIEW</div><h1 id="title">Dashboard</h1></div><button class="primary" onclick="newDoc('quotation')">+ New Document</button></header><div class="content" id="content"></div></div></div><script>
const KEY='gv-documents-v1',CUSTOM='gv-customers-v1';let docs=JSON.parse(localStorage.getItem(KEY)||'[]'),customers=JSON.parse(localStorage.getItem(CUSTOM)||'[]'),view='dashboard',editing=null,doc=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const kinds={quotation:'Quotation',proforma:'Payment Request',invoice:'Invoice',receipt:'Payment Receipt'};function ref(type){const b=new Uint8Array(5);crypto.getRandomValues(b);return ({quotation:'QT',proforma:'PR',invoice:'INV',receipt:'PAY'}[type]||'DOC')+'-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+Array.from(b,x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}function store(){localStorage.setItem(KEY,JSON.stringify(docs));localStorage.setItem(CUSTOM,JSON.stringify(customers))}function total(d){return (d.items||[]).reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0)}function nav(){const links=[['dashboard','▦','Dashboard'],['documents','▤','Documents'],['quotation','·','Quotations'],['proforma','·','Payment Requests'],['invoice','·','Invoices'],['customers','◉','Customers'],['payments','▭','Payments']];$('#nav').innerHTML=links.map(([v,i,t])=>'<button class="nav '+(v===view?'active ':'')+(['quotation','proforma','invoice'].includes(v)?'sub':'')+'" onclick="go(\''+v+'\')">'+i+' <span>'+t+'</span></button>').join('')}function go(v){view=v;editing=null;doc=null;render()}function render(){nav();$('#title').textContent=({dashboard:'Dashboard',documents:'Documents',quotation:'Quotations',proforma:'Payment Requests',invoice:'Invoices',customers:'Customers',payments:'Payments',editor:'Document editor'})[view]||'Documents';if(view==='editor')return editor();if(view==='customers')return customerView();if(view==='dashboard'){const amount=t=>docs.filter(d=>d.type===t).reduce((s,d)=>s+total(d),0);$('#content').innerHTML='<div class="cards">'+[['Quotations',docs.filter(d=>d.type==='quotation').length],['Invoices',docs.filter(d=>d.type==='invoice').length],['Invoice value','MVR '+money(amount('invoice'))],['Payments received','MVR '+money(docs.filter(d=>d.type==='invoice').reduce((s,d)=>s+(+d.paid||0),0))]].map(([a,b])=>'<div class="card"><small>'+a+'</small><b>'+b+'</b></div>').join('')+'</div><div class="panel"><h2>Recent documents</h2>'+docTable(docs.slice().reverse().slice(0,10))+'</div>';return}let filtered=view==='documents'?docs:view==='payments'?docs.filter(d=>d.type==='invoice'&&+d.paid>0):docs.filter(d=>d.type===view);$('#content').innerHTML='<div class="panel"><div class="actions">'+(view!=='payments'?'<button class="primary" onclick="newDoc(\''+(kinds[view]?view:'quotation')+'\')">+ Create document</button>':'')+'</div>'+docTable(filtered.slice().reverse())+'</div>'}function docTable(list){if(!list.length)return '<div class="empty">No documents yet. Select New Document to begin.</div>';return '<div style="overflow:auto"><table><thead><tr><th>Number</th><th>Type</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>'+list.map(d=>'<tr><td>'+esc(d.number)+'</td><td>'+esc(kinds[d.type])+'</td><td>'+esc(d.customer)+'</td><td>'+esc(d.date)+'</td><td>MVR '+money(total(d))+'</td><td><span class="pill">'+(d.type==='invoice'?(+d.paid>=total(d)&&total(d)>0?'Paid':+d.paid>0?'Part paid':'Unpaid'):'Saved')+'</span></td><td><button class="secondary" onclick="openDoc(\''+d.id+'\')">Open</button></td></tr>').join('')+'</tbody></table></div>'}function newDoc(type){if(!kinds[type])type='quotation';doc={id:crypto.randomUUID(),type,number:ref(type),customer:'',project:'',date:new Date().toISOString().slice(0,10),valid:'',paid:0,terms:'Payment and scope as agreed. GST not charged (not GST registered).',paper:'A5',orientation:'landscape',items:[{desc:'',qty:1,price:0}]};editing=null;view='editor';render()}function openDoc(id){const found=docs.find(x=>x.id===id);if(!found)return;doc=structuredClone(found);editing=id;view='editor';render()}function customerView(){$('#content').innerHTML='<div class="panel"><h2>Customers</h2><div class="actions"><input id="customerName" placeholder="Customer name"><input id="customerPhone" placeholder="Phone / contact"><button class="primary" onclick="addCustomer()">Add customer</button></div>'+(!customers.length?'<div class="empty">No customers saved.</div>':'<table><tr><th>Name</th><th>Contact</th></tr>'+customers.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td></tr>').join('')+'</table>')+'</div>'}function addCustomer(){const name=$('#customerName').value.trim();if(!name)return alert('Enter a customer name');customers.push({name,phone:$('#customerPhone').value});store();render()}function editor(){nav();$('#title').textContent=editing?'Edit '+kinds[doc.type]:'New '+kinds[doc.type];$('#content').innerHTML='<div class="editor print-view"><div class="panel edit-panel" style="margin:0"><h2>Document details</h2><p class="muted">Edit on the left. Preview updates instantly.</p><label class="field">Document type<select id="type" onchange="changeType(this.value)">'+Object.entries(kinds).filter(([k])=>k!=='receipt').map(([k,v])=>'<option value="'+k+'" '+(doc.type===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="field">Document number<input id="number" readonly value="'+esc(doc.number)+'"></label><label class="field">Customer<input id="customer" list="customersList" value="'+esc(doc.customer)+'" oninput="update(\'customer\',this.value)"><datalist id="customersList">'+customers.map(c=>'<option value="'+esc(c.name)+'">').join('')+'</datalist></label><label class="field">Project / location<textarea id="project" oninput="update(\'project\',this.value)">'+esc(doc.project)+'</textarea></label><div class="fieldrow"><label class="field">Date<input type="date" value="'+esc(doc.date)+'" oninput="update(\'date\',this.value)"></label><label class="field">Valid until<input type="date" value="'+esc(doc.valid)+'" oninput="update(\'valid\',this.value)"></label></div><h2>Items</h2><div id="itemsEditor" class="items-edit"></div><button class="secondary" onclick="addItem()">+ Add item</button><label class="field" style="margin-top:15px">Terms<textarea oninput="update(\'terms\',this.value)">'+esc(doc.terms)+'</textarea></label>'+(doc.type==='invoice'?'<label class="field">Payment received (MVR)<input type="number" min="0" step=".01" value="'+(+doc.paid||0)+'" oninput="update(\'paid\',this.value)"></label>':'')+'<div class="fieldrow"><label class="field">Paper<select onchange="update(\'paper\',this.value)"><option '+(doc.paper==='A5'?'selected':'')+'>A5</option><option '+(doc.paper==='A4'?'selected':'')+'>A4</option></select></label><label class="field">Orientation<select onchange="update(\'orientation\',this.value)"><option value="landscape" '+(doc.orientation==='landscape'?'selected':'')+'>Landscape</option><option value="portrait" '+(doc.orientation==='portrait'?'selected':'')+'>Portrait</option></select></label></div><div class="actions"><button class="primary" onclick="saveDoc()">Save document</button><button class="secondary" onclick="printDoc()">Print / PDF</button><button class="secondary" onclick="go(\'documents\')">Back</button></div><p class="muted">Saved locally on this device. Cloud synchronization is not enabled.</p></div><div><p class="preview-caption muted">LIVE PRINT PREVIEW · '+doc.paper+' '+doc.orientation+'</p><div class="preview-wrap"><article id="paper" class="paper"></article></div></div></div>';renderItems();preview()}function changeType(type){if(doc.type===type)return;if(!confirm('Change document type and generate a new number?')){render();return}doc.type=type;doc.number=ref(type);editing=null;render()}function update(key,value){doc[key]=value;preview()}function addItem(){doc.items.push({desc:'',qty:1,price:0});renderItems();preview()}function removeItem(i){doc.items.splice(i,1);renderItems();preview()}function itemUpdate(i,k,v){doc.items[i][k]=v;preview()}function renderItems(){$('#itemsEditor').innerHTML=doc.items.map((x,i)=>'<div class="item-edit"><input placeholder="Description" value="'+esc(x.desc)+'" oninput="itemUpdate('+i+',\'desc\',this.value)"><input type="number" min="0" step="any" aria-label="Quantity" value="'+esc(x.qty)+'" oninput="itemUpdate('+i+',\'qty\',this.value)"><input type="number" min="0" step=".01" aria-label="Unit price" value="'+esc(x.price)+'" oninput="itemUpdate('+i+',\'price\',this.value)"><button aria-label="Remove item" onclick="removeItem('+i+')">×</button></div>').join('')}function preview(){const p=$('#paper');if(!p)return;p.className='paper '+doc.paper.toLowerCase()+' '+doc.orientation;$('#pageStyle').textContent='@page{size:'+doc.paper+' '+doc.orientation+';margin:8mm}';$('.preview-caption').textContent='LIVE PRINT PREVIEW · '+doc.paper+' '+doc.orientation;const t=total(doc),paid=+doc.paid||0,isReceipt=doc.type==='receipt';const status=doc.type==='invoice'?(paid>=t&&t>0?'PAID':paid>0?'PART PAID':'UNPAID'):isReceipt?'RECEIVED':'ISSUED';const heading='<div class="dochead"><div><span class="brandmark">GV</span><div class="brandtext"><strong>Gulheefalhu View</strong><div style="font:9px Arial,sans-serif;color:#55716b;margin-top:5px">Building • Construction • Project Services</div><div style="font:8px Arial,sans-serif;color:#778c88">Business Registration SP34722026</div></div></div><div style="text-align:right"><h2>'+esc(kinds[doc.type])+'</h2><b style="font:10px Arial,sans-serif">'+esc(doc.number)+'</b><div><span class="status-stamp">'+status+'</span></div></div></div>';const details='<div class="docmeta"><div><small>PREPARED FOR</small><p style="font-size:14px"><b>'+esc(doc.customer||'Customer name')+'</b></p><p>'+esc(doc.project||'Project / site')+'</p></div><div><small>DOCUMENT DETAILS</small><p><b>Reference:</b> '+esc(doc.number)+'</p><p><b>Issue date:</b> '+esc(doc.date)+'</p>'+(doc.valid?'<p><b>Valid until:</b> '+esc(doc.valid)+'</p>':'')+'</div></div>';const rows='<table><thead><tr><th>Description</th><th>Qty</th><th>Rate (MVR)</th><th>Amount (MVR)</th></tr></thead><tbody>'+doc.items.map(x=>'<tr><td>'+esc(x.desc||'Item description')+'</td><td>'+esc(x.qty)+'</td><td>'+money(x.price)+'</td><td><b>'+money((+x.qty||0)*(+x.price||0))+'</b></td></tr>').join('')+'</tbody></table>';const summary='<div class="sum">Total (MVR) &nbsp; '+money(t)+'</div>'+(doc.type==='invoice'?'<div class="summary-grid"><div><small>Invoice total</small><b>MVR '+money(t)+'</b></div><div><small>Payment received</small><b>MVR '+money(paid)+'</b></div><div><small>Balance remaining</small><b>MVR '+money(Math.max(0,t-paid))+'</b></div></div>':'');const foot='<div class="docfoot"><div><small class="eyebrow">TERMS & CONDITIONS</small><p style="white-space:pre-wrap">'+esc(doc.terms)+'</p></div></div><div class="thanks">Thank you for your business. We appreciate your continued support.</div><div class="doc-bottom"><span>Gulheefalhu View | Maldives</span><span>'+esc(doc.number)+'</span></div>';p.innerHTML=heading+details+rows+summary+foot}function saveDoc(){if(!doc.customer.trim())return alert('Please enter a customer name');const idx=docs.findIndex(d=>d.id===doc.id);if(idx>=0)docs[idx]=structuredClone(doc);else docs.push(structuredClone(doc));store();editing=doc.id;alert('Document saved on this device')}function printDoc(){window.print()}render();
</script></body></html>
