function restorePage(){try{const saved=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');if(!saved)return;const allowed=['dashboard','documents','quotation','proforma','invoice','customers','payments','editor'];if(!allowed.includes(saved.view))return;if(saved.view==='editor'){if(!saved.doc||!Array.isArray(saved.doc.items)||!kinds[saved.doc.type])return;doc=saved.doc;doc.paper='A4';editing=saved.editing||null}view=saved.view}catch(e){}}
function nav(){const links=[['dashboard','▦','Dashboard'],['documents','▤','Documents'],['quotation','·','Quotations'],['proforma','·','Payment Requests'],['invoice','·','Invoices'],['customers','◉','Customers'],['payments','▭','Payments']];$('#nav').innerHTML=links.map(([v,i,t])=>'<button class="nav '+(v===view?'active ':'')+(['quotation','proforma','invoice'].includes(v)?'sub':'')+'" onclick="go(\''+v+'\')">'+i+' <span>'+t+'</span></button>').join('')}function go(v){view=v;editing=null;doc=null;rememberPage();render()}function render(){rememberPage();nav();$('#title').textContent=({dashboard:'Dashboard',documents:'Documents',quotation:'Quotations',proforma:'Payment Requests',invoice:'Invoices',customers:'Customers',payments:'Payments',editor:'Document editor'})[view]||'Documents';if(view==='editor')return editor();if(view==='customers')return customerView();if(view==='dashboard'){const amount=t=>docs.filter(d=>d.type===t).reduce((s,d)=>s+total(d),0);$('#content').innerHTML='<div class="cards">'+[['Quotations',docs.filter(d=>d.type==='quotation').length],['Invoices',docs.filter(d=>d.type==='invoice').length],['Invoice value','MVR '+money(amount('invoice'))],['Payments received','MVR '+money(docs.filter(d=>d.type==='invoice').reduce((s,d)=>s+(+d.paid||0),0))]].map(([a,b])=>'<div class="card"><small>'+a+'</small><b>'+b+'</b></div>').join('')+'</div><div class="panel"><h2>Recent documents</h2>'+publishedQuotationRow()+secondPublishedQuotationRow()+docTable(docs.slice().reverse().slice(0,10))+'</div>';return}let filtered=view==='documents'?docs:view==='payments'?docs.filter(d=>d.type==='invoice'&&+d.paid>0):docs.filter(d=>d.type===view);$('#content').innerHTML='<div class="panel"><div class="actions">'+(view!=='payments'?'<button class="primary" onclick="newDoc(\''+(kinds[view]?view:'quotation')+'\')">+ Create document</button>':'')+'</div>'+((view==='quotation'||view==='documents')?publishedQuotationRow()+secondPublishedQuotationRow():'')+docTable(filtered.slice().reverse())+'</div>'}function publishedQuotationRow(){return '<div class="published-quotation" style="margin:16px 0 20px;padding:18px 20px;background:#fff;border:1px solid #d8dfe6;border-left:4px solid #9b7069;border-radius:8px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><small style="display:block;color:#805b55;font-weight:700;letter-spacing:.6px;margin-bottom:5px">PUBLISHED QUOTATION · GV-Q-2026-001</small><strong style="display:block;font-size:15px">Muhyiddin School — Preschool Light Replacement</strong><span style="display:block;color:#5d6671;margin-top:5px">28 October 2026 · MVR 9,400.00 · A4</span><small style="display:block;color:#6d7782;margin-top:5px">Published on the website (not saved in this browser-local document database)</small></div><a href="quotation-muhyiddin-school-2026.html" target="_blank" rel="noopener" style="display:inline-block;padding:11px 16px;border-radius:6px;background:#173c5b;color:#fff;text-decoration:none;font-weight:700">Open quotation ↗</a></div>'}
function secondPublishedQuotationRow(){return '<div class="published-quotation" style="margin:16px 0 20px;padding:18px 20px;background:#fff;border:1px solid #d8dfe6;border-left:4px solid #9b7069;border-radius:8px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><small style="display:block;color:#805b55;font-weight:700;letter-spacing:.6px;margin-bottom:5px">PUBLISHED QUOTATION · GV-Q-2026-002</small><strong style="display:block;font-size:15px">Muhyiddin School — Main Gate Wheel Replacement</strong><span style="display:block;color:#5d6671;margin-top:5px">28 October 2026 · MVR 3,300.00 · A4</span><small style="display:block;color:#6d7782;margin-top:5px">Published on the website (not saved in this browser-local document database)</small></div><a href="quotation-muhyiddin-school-gate-wheel-2026.html" target="_blank" rel="noopener" style="display:inline-block;padding:11px 16px;border-radius:6px;background:#173c5b;color:#fff;text-decoration:none;font-weight:700">Open quotation ↗</a></div>'}
function docTable(list){if(!list.length)return '<div class="empty">No documents yet. Select New Document to begin.</div>';return '<div style="overflow:auto"><table><thead><tr><th>Number</th><th>Type</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>'+list.map(d=>'<tr><td>'+esc(d.number)+'</td><td>'+esc(kinds[d.type])+'</td><td>'+esc(d.customer)+'</td><td>'+esc(d.date)+'</td><td>MVR '+money(total(d))+'</td><td><span class="pill">'+(d.type==='invoice'?(+d.paid>=total(d)&&total(d)>0?'Paid':+d.paid>0?'Part paid':'Unpaid'):'Saved')+'</span></td><td><button class="secondary" onclick="openDoc(\''+d.id+'\')">Open</button></td></tr>').join('')+'</tbody></table></div>'}function newDoc(type){if(!kinds[type])type='quotation';doc={id:crypto.randomUUID(),type,number:ref(type),customer:'',project:'',date:new Date().toISOString().slice(0,10),valid:'',paid:0,terms:'Payment and scope as agreed. GST not charged (not GST registered).',paper:'A4',orientation:'portrait',items:[{desc:'',qty:1,price:0}]};editing=null;view='editor';render()}function openDoc(id){const found=docs.find(x=>x.id===id);if(!found)return;doc=structuredClone(found);doc.paper='A4';editing=id;view='editor';render()}function customerView(){$('#content').innerHTML='<div class="panel"><h2>Customers</h2><div class="actions"><input id="customerName" placeholder="Customer name"><input id="customerPhone" placeholder="Phone / contact"><button class="primary" onclick="addCustomer()">Add customer</button></div>'+(!customers.length?'<div class="empty">No customers saved.</div>':'<table><tr><th>Name</th><th>Contact</th></tr>'+customers.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td></tr>').join('')+'</table>')+'</div>'}function addCustomer(){const name=$('#customerName').value.trim();if(!name)return alert('Enter a customer name');customers.push({name,phone:$('#customerPhone').value});store();render()}function editor(){nav();$('#title').textContent=editing?'Edit '+kinds[doc.type]:'New '+kinds[doc.type];$('#content').innerHTML='<div class="editor print-view"><div class="panel edit-panel" style="margin:0"><h2>Document details</h2><p class="muted">Edit on the left. Preview updates instantly.</p><label class="field">Document type<select id="type" onchange="changeType(this.value)">'+Object.entries(kinds).filter(([k])=>k!=='receipt').map(([k,v])=>'<option value="'+k+'" '+(doc.type===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="field">Document number<input id="number" readonly value="'+esc(doc.number)+'"></label><label class="field">Customer<input id="customer" list="customersList" value="'+esc(doc.customer)+'" oninput="update(\'customer\',this.value)"><datalist id="customersList">'+customers.map(c=>'<option value="'+esc(c.name)+'">').join('')+'</datalist></label><label class="field">Project / location<textarea id="project" oninput="update(\'project\',this.value)">'+esc(doc.project)+'</textarea></label><div class="fieldrow"><label class="field">Date<input type="date" value="'+esc(doc.date)+'" oninput="update(\'date\',this.value)"></label><label class="field">Valid until<input type="date" value="'+esc(doc.valid)+'" oninput="update(\'valid\',this.value)"></label></div><h2>Items</h2><div id="itemsEditor" class="items-edit"></div><button class="secondary" onclick="addItem()">+ Add item</button><label class="field" style="margin-top:15px">Terms<textarea oninput="update(\'terms\',this.value)">'+esc(doc.terms)+'</textarea></label>'+(doc.type==='invoice'?'<label class="field">Payment received (MVR)<input type="number" min="0" step=".01" value="'+(+doc.paid||0)+'" oninput="update(\'paid\',this.value)"></label>':'')+'<div class="fieldrow"><label class="field">Paper<input value="A4 — standard" readonly aria-label="Paper size A4"></label><label class="field">Orientation<select onchange="update(\'orientation\',this.value)"><option value="landscape" '+(doc.orientation==='landscape'?'selected':'')+'>Landscape</option><option value="portrait" '+(doc.orientation==='portrait'?'selected':'')+'>Portrait</option></select></label></div><div class="actions"><button class="primary" onclick="saveDoc()">Save document</button><button class="secondary" onclick="printDoc()">Print / PDF</button><button class="secondary" onclick="go(\'documents\')">Back</button></div><p class="muted">Saved locally on this device. Cloud synchronization is not enabled.</p></div><div><p class="preview-caption muted">LIVE PRINT PREVIEW · '+doc.paper+' '+doc.orientation+'</p><div class="preview-wrap"><article id="paper" class="paper"></article></div></div></div>';renderItems();preview()}function changeType(type){if(doc.type===type)return;if(!confirm('Change document type and generate a new number?')){render();return}doc.type=type;doc.number=ref(type);editing=null;render()}function update(key,value){doc[key]=value;preview()}function addItem(){doc.items.push({desc:'',qty:1,price:0});renderItems();preview()}function removeItem(i){doc.items.splice(i,1);renderItems();preview()}function itemUpdate(i,k,v){doc.items[i][k]=v;preview()}function renderItems(){$('#itemsEditor').innerHTML=doc.items.map((x,i)=>'<div class="item-edit"><input placeholder="Description" value="'+esc(x.desc)+'" oninput="itemUpdate('+i+',\'desc\',this.value)"><input type="number" min="0" step="any" aria-label="Quantity" value="'+esc(x.qty)+'" oninput="itemUpdate('+i+',\'qty\',this.value)"><input type="number" min="0" step=".01" aria-label="Unit price" value="'+esc(x.price)+'" oninput="itemUpdate('+i+',\'price\',this.value)"><button aria-label="Remove item" onclick="removeItem('+i+')">×</button></div>').join('')}function preview(){rememberPage();const p=$('#paper');if(!p)return;doc.paper='A4';p.className='paper a4 '+doc.orientation;$('#pageStyle').textContent='@page{size:A4 '+doc.orientation+';margin:10mm}';$('.preview-caption').textContent='LIVE PRINT PREVIEW · '+doc.paper+' '+doc.orientation;const t=total(doc),paid=+doc.paid||0;const title=kinds[doc.type];const rows=doc.items.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.desc||'Description of works / materials')+'</td><td class="n">'+esc(x.qty)+'</td><td class="n">'+money(x.price)+'</td><td class="n"><b>'+money((+x.qty||0)*(+x.price||0))+'</b></td></tr>').join('');p.innerHTML='<header class="gv-document-header"><div class="gv-mast"><div class="gv-logo"><img src="assets/gulheefalhu-view-logo.png?v=clean-20261028" alt="Gulheefalhu View logo"></div><div class="gv-contact">Gulheefalhu View · SP34722026<br>V, Lovely House, Boakeyo Goalhi 00960<br>K. Villigili, Maldives<br>Mobile: +960 7635654<br>gulheefalhuview@gmail.com</div></div><div class="gv-hero"><h2>'+esc(title)+'</h2><div class="gv-quote-facts"><div><b>Reference</b><span>'+esc(doc.number)+'</span></div><div><b>Date</b><span>'+esc(doc.date)+'</span></div>'+(doc.valid?'<div><b>Valid until</b><span>'+esc(doc.valid)+'</span></div>':'')+'</div></div></header><main class="gv-document-body"><div class="gv-details"><div class="gv-info-box"><div class="gv-section-label">TO</div><p><strong>'+esc(doc.customer||'Client / company name')+'</strong></p></div><div class="gv-info-box"><div class="gv-section-label">PROJECT</div><p>'+esc(doc.project||'Project name, site or scope')+'</p></div></div><div class="gv-section-heading"><span>WORK SCHEDULE &amp; PRICING</span><span>Currency: MVR</span></div><table class="gv-table"><thead><tr><th style="width:6%">No.</th><th>Description of work / materials</th><th style="width:10%;text-align:right">Qty</th><th style="width:19%;text-align:right">Unit price (MVR)</th><th style="width:20%;text-align:right">Amount (MVR)</th></tr></thead><tbody>'+rows+'</tbody></table><div class="gv-bottom"><div class="gv-notes"><div class="gv-section-label">Terms &amp; Conditions</div><div style="white-space:pre-wrap">'+esc(doc.terms)+'</div></div><div class="gv-pricing"><div class="total"><span>TOTAL (MVR)</span><span>'+money(t)+'</span></div>'+(doc.type==='invoice'?'<small>Received: MVR '+money(paid)+' · Balance: MVR '+money(Math.max(0,t-paid))+'</small>':'<small>GST not charged · Not GST registered</small>')+'</div></div></main><footer class="gv-document-footer"><div class="gv-accept"><div class="gv-sign"><span>Prepared &amp; authorized by</span><strong>Nashid Waheed · Proprietor</strong><i>Signature</i></div><div class="gv-sign"><span>Approved / accepted by</span><strong>Client representative</strong><i>Signature &amp; date</i></div></div><div class="gv-footer"><span>GULHEEFALHU VIEW · MALDIVES</span><span>'+esc(doc.number)+'</span></div></footer>'}function saveDoc(){if(!doc.customer.trim())return alert('Please enter a customer name');const idx=docs.findIndex(d=>d.id===doc.id);if(idx>=0)docs[idx]=structuredClone(doc);else docs.push(structuredClone(doc));store();editing=doc.id;rememberPage();alert('Document saved on this device')}function printDoc(){window.print()}restorePage();render();
</script></body></html>
